[project]
name = "dating-copilot"
version = "0.1.0"
description = "Personal copilot for dating-app conversations. Single-agent, file-based, git-versioned."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "markdown-it-py>=3.0.0",
]

[project.scripts]
dcp = "dcp:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dcp", "webui"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["templates/*.html", "static/*.css", "prompts/*.md"]
